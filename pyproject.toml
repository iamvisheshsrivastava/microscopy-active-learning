[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maldl"
version = "0.1.0"
description = "Representation learning and active learning for multi-scale scientific imaging (SEM/EBSD), with scale and instrument shift evaluation"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scipy", "scikit-learn", "pillow", "matplotlib", "torch"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
